schema_version: 1
id: epvs
title: ePVS compatibility profile
knowledge_template: standard-product
project_profile_example: profiles/epvs/project.example.yaml
private_project_profile: config/projects/epvs.yaml
workflow_packs:
  - feature-quality
  - bug-regression
  - release-acceptance
legacy:
  product_line_tracks:
    v1: v1
    v2: v2
    shared: shared
  repository_groups:
    dev: product
    test: automation
    tools: tools
  output_routing:
    feature:
      v1: outputs/v1
      v2: outputs/v2
      shared: outputs/shared
    bug:
      frontend: outputs/<owning-track>
      backend: outputs/shared
      other: outputs/shared
    release: outputs/releases/<release-id>
  skills:
    requirement-analysis: epvs-requirement
    test-analysis: epvs-test-points
    test-case-design: epvs-test-cases
    automation: epvs-automation
    reporting: epvs-reporting
    release-acceptance: epvs-acceptance
    zentao-sync: epvs-zentao-sync
    data-preparation: epvs-data-injection
private_extensions:
  - knowledge sources and confirmed domain knowledge
  - repository checkout paths and revisions
  - ZenTao product and module identifiers
  - environment endpoints and credentials
  - executable shared-data and release policies
